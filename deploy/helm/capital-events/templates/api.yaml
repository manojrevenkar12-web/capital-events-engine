apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ce.name" . }}-api
  labels: {{- include "ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "ce.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "ce.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "ce.name" . }}
      securityContext: {{- include "ce.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ce.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ include "ce.image" (dict "root" . "which" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          # every replica drains the outbox; FOR UPDATE SKIP LOCKED keeps them off each other's rows
          env: {{- include "ce.apiEnv" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          lifecycle:
            # let the load balancer stop routing before the process stops accepting
            preStop: { sleep: { seconds: 10 } }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "ce.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ce.name" . }}-api
  labels: {{- include "ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "ce.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ce.name" . }}-api
  labels: {{- include "ce.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "ce.name" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPU }} } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ce.name" . }}-api
  labels: {{- include "ce.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "ce.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
