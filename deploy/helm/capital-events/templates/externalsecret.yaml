{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "ce.labels" . | nindent 4 }}
  # created before the migration hook, which needs the secret it produces
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.secrets.externalSecret.store }} }
  # Orphan: the Secret outlives the hook object between upgrades, so running pods keep it
  target: { name: {{ .Values.secrets.name }}, creationPolicy: Orphan }
  dataFrom:
    - extract: { key: {{ .Values.secrets.externalSecret.remoteKey }} }
{{- end }}
