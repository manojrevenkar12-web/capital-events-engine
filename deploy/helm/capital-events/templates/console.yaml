apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ce.name" . }}-console
  labels: {{- include "ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "ce.selector" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels: {{- include "ce.selector" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: {{ include "ce.image" (dict "root" . "which" "console") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext: {{- include "ce.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run, emptyDir: { sizeLimit: 8Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ce.name" . }}-console
  labels: {{- include "ce.labels" . | nindent 4 }}
spec:
  selector: {{- include "ce.selector" . | nindent 4 }}
    app.kubernetes.io/component: console
  ports: [{ name: http, port: 80, targetPort: http }]
